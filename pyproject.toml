[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "better-are-react-agent"
version = "0.1.0.dev0"
description = "Research reimplementations of RSI-improved native ARE ReAct agents for GAIA2"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "zhangdw156"}]
dependencies = ["meta-agents-research-environments==1.2.0"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.scripts]
better-are-react-agent = "better_are_react_agent.cli:main"

[project.entry-points."are.react_agents"]
baseline = "better_are_react_agent.factories:baseline"
autosaddler-appendix = "better_are_react_agent.factories:autosaddler_appendix"
activesaddler-appendix = "better_are_react_agent.factories:activesaddler_appendix"
paretosaddler-i23-appendix = "better_are_react_agent.factories:paretosaddler_i23_appendix"
paretosaddler-i22-appendix = "better_are_react_agent.factories:paretosaddler_i22_appendix"
harnessmm-public-continuation = "better_are_react_agent.factories:harnessmm_public_continuation"

[project.urls]
Repository = "https://github.com/zhangdw156/better-are-react-agent"

[tool.hatch.build.targets.wheel]
packages = ["src/better_are_react_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
exclude = ["src/better_are_react_agent/vendor/*"]
