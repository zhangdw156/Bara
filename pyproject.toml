[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bara"
version = "0.1.0.dev0"
description = "Independent ARE ReAct research source trees and the bara evaluation CLI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "zhangdw156"}]
dependencies = ["click==8.1.8"]

[project.scripts]
bara = "bara.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.urls]
Repository = "https://github.com/zhangdw156/Bara"

[tool.hatch.build.targets.wheel]
packages = ["src/bara"]

[tool.pytest.ini_options]
testpaths = ["tests/cli"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
