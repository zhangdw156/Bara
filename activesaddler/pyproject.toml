[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "meta-agents-research-environments"
version = "1.2.0"
description = "ActiveSaddler research reconstruction on native ARE ReAct"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "click==8.1.8",
  "datasets==4.0.0",
  "docstring-parser==0.16",
  "fsspec==2024.12.0",
  "huggingface-hub==0.33.4",
  "inputimeout==1.0.4",
  "Jinja2==3.1.6",
  "litellm==1.71.1",
  "mcp[cli]==1.11.0",
  "numpy==2.2.6",
  "pillow==11.1.0",
  "polars-lts-cpu==1.33.1",
  "pydantic==2.10.6",
  "python-dotenv==1.0.1",
  "rapidfuzz==3.12.1",
  "termcolor==2.5.0",
  "mammoth==1.8.0",
  "markdownify==0.14.1",
  "pandas==2.2.3",
  "pdfminer.six==20231228",
  "puremagic==1.27",
  "python-pptx==1.0.2"
]

[project.scripts]
are-benchmark = "are.simulation.benchmark:main"
are-run = "are.simulation.main:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["are"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
